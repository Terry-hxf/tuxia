base64:
  bestFor:
    - "把 PNG、JPG、WebP、SVG、GIF 或 BMP 图片转换成 Base64 Data URL。"
    - "粘贴 Base64 图片文本后预览还原结果，检查编码是否可用。"
    - "复制图片 Data URL，用于 CSS、HTML、邮件模板、文档或测试数据。"
  steps:
    - "把图片拖入左侧区域，页面会生成 Base64 Data URL。"
    - "把 Base64 文本粘贴到右侧区域，预览解码后的图片。"
    - "确认结果后复制编码，或按需要下载还原后的图片。"
  privacy: "Base64 编码和解码都在浏览器本地完成，TUXIA 不会把图片或粘贴的 Base64 文本上传到服务器。"
  introduction: |
    Base64 编码将图片的二进制数据转换为纯文本字符串，可以直接嵌入 HTML、CSS、JSON 或其他文本格式中。这在需要把图片打包进单个文件的场景下非常实用——比如自包含的 HTML 邮件、单文件网页组件，或者不适合引用外部图片的 CSS 样式表。TUXIA 的图片 Base64 工具箱采用双面板布局：左侧面板将任意图片转为 Base64 Data URL，同时显示字符数和估算文件大小；右侧面板则让你粘贴任意 Base64 字符串，即时解码并预览还原后的图片。两项操作均在你的浏览器内通过 FileReader 和 Canvas API 完成，图片文件和 Base64 文本不会离开你的设备。
  useCases:
    - title: "CSS 与 HTML 内嵌"
      description: "把小图标、Logo 和装饰元素以 Base64 Data URL 形式直接嵌入 CSS 或 HTML，消除额外的 HTTP 请求，特别适合单页应用、邮件模板和离线网页。"
    - title: "接口数据传输"
      description: "通过 REST API 或 GraphQL 传输图片时，Base64 编码提供文本安全的格式，避免二进制数据在 JSON 序列化时损坏。"
    - title: "调试与测试"
      description: "Base64 输出便于在日志中检查图片数据、对比不同格式的编码差异，或创建可复用的测试用例。"
  technicalNotes:
    - "Base64 编码后的体积比原始二进制大约增加 33%，一张 1 MB 的图片编码后约为 1.33 MB。"
    - "浏览器对超长 Base64 字符串在文本框中的处理性能有限，超过 2-3 MB 的图片建议改用直接文件传输。"
    - "`data:image/` 前缀指定了 MIME 类型，TUXIA 会根据检测到的图片格式自动添加正确的前缀。"
    - "解码时，以 `data:image/` 开头的字符串被视为完整 Data URL，无前缀的原始 Base64 默认按 PNG 解码。"
  comparisons: |
    与需要上传图片到服务器的在线 Base64 转换工具不同，TUXIA 的所有处理都在浏览器本地完成，不存在文件大小限制（仅受浏览器内存约束），也无需等待上传。不过，Base64 编码本身不会压缩图片——如果你首要考虑的是文件大小，建议先用 TUXIA 的图片压缩工具处理，再进行编码。
  bestPractices:
    - "尽量将 Base64 编码的图片控制在 10 KB 以内，图标、小 Logo 和内联图形是最佳选择，全分辨率照片则不适合。"
    - "将 Base64 用于首屏图片，可以减少阻塞渲染的 HTTP 请求数量。"
    - "在 CSS 中嵌入 Base64 时，把它放在样式表末尾或内联 `<style>` 块中，避免阻塞关键 CSS 的加载。"
    - "投入生产前务必测试解码后的图片，确认尺寸、颜色和透明度均无误。"

online:
  bestFor:
    - "使用你自己的 ImgBB API Key 上传图片并生成公开链接。"
    - "生成可复制、可分享的图片 URL，用于临时分享或跨设备查看。"
    - "保持上传路径透明：浏览器直接请求 ImgBB，不经过 TUXIA 服务器。"
  steps:
    - "在设置区填写你的 ImgBB API Key。"
    - "选择图片并在页面中预览文件信息。"
    - "点击上传后复制返回的图片链接。"
  privacy: "这是唯一会把图片发送到第三方的工具。只有你点击上传后，浏览器才会使用你的 API Key 直接把图片发送到 ImgBB。"
  introduction: |
    大部分 TUXIA 工具都在本地处理图片，不发起任何网络请求，但图片链接生成器有着不同的用途——为图片创建一个可公开访问的链接。当你需要在论坛发图、在聊天消息中嵌入图片、发送给无法接收附件的人，或者在不托管图片的网站上展示图片时，这个工具就派上了用场。它使用 ImgBB 的 API，需要你提供自己的 API Key（可从 ImgBB 免费获取）。配置完成后，浏览器会直接将图片发送到 ImgBB，并返回直链地址和查看页面地址供你复制分享。TUXIA 不会中转、存储或查看你上传的图片——连接仅存在于你的浏览器与 ImgBB 之间。
  useCases:
    - title: "免附件快速分享"
      description: "无需通过邮件发送大附件，也不必担心聊天应用压缩画质，上传后获得可分享链接，收件人打开链接即可看到原图画质。"
    - title: "跨设备传输"
      description: "在电脑上上传图片，然后在手机、平板或其他设备上打开生成的链接，无需数据线、云同步或聊天软件中转。"
    - title: "临时素材交付"
      description: "设计师和开发者可将草稿图、效果图或截图通过临时公开链接分享给客户或同事，无需提交到永久托管平台。"
  technicalNotes:
    - "ImgBB API Key 可免费从 ImgBB 账户控制台获取，Key 仅保存在你浏览器的 localStorage 中，不会上传到任何 TUXIA 服务器。"
    - "上传限额取决于你的 ImgBB 账户等级，免费账户通常允许单文件最大 32 MB。"
    - "图片通过 HTTPS 从你的浏览器直接发送到 ImgBB API 端点，TUXIA 的静态站点无法拦截或修改该请求。"
    - "生成的链接是公开的——任何拥有链接的人都可以查看图片，请勿用于私密、敏感或机密图片。"
  comparisons: |
    与需要注册账户和管理文件夹的云存储服务（Google Drive、Dropbox）不同，图片链接生成器一步即可创建直接的匿名图片链接。但需注意，ImgBB 链接可能会根据其保留策略过期或被移除。如果需要永久托管，建议使用专门的图片托管服务或你自己的 Web 服务器。
  bestPractices:
    - "上传前先预览图片，确认是正确文件且不包含意外的元数据。"
    - "建议先用其他 TUXIA 工具压缩或调整图片尺寸，再生成链接，以减少上传时间和带宽消耗。"
    - "将 ImgBB API Key 保存在浏览器设置面板中，避免每次都要重新输入。"
    - "重要的 ImgBB 查看页面链接建议收藏，因为免费账户的图片可能最终被 ImgBB 移除。"

qrcode-gen:
  bestFor:
    - "把网址、文本或短消息生成二维码。"
    - "自定义二维码尺寸、容错等级、前景色、背景色、点样式和 Logo。"
    - "导出 PNG 或 SVG，用于网页、印刷和运营物料。"
  steps:
    - "输入需要编码的文本或链接。"
    - "调整尺寸、容错等级、颜色、样式和可选 Logo。"
    - "预览二维码并选择 PNG 或 SVG 下载。"
  privacy: "二维码生成在浏览器本地完成，你输入的文本不会发送到 TUXIA 服务器。"
  introduction: |
    二维码已成为连接物理世界与数字内容的重要桥梁——它们出现在产品包装、餐厅菜单、活动门票、名片和营销物料上。TUXIA 的二维码生成器让你在保证可扫描的前提下，自由掌控二维码的外观。你可以调整像素尺寸、从四个容错等级（L、M、Q、H）中选择、自定义前景色和背景色、切换方形点或圆角样式、修改角块图案，还可以选择在中心嵌入 Logo。实时预览会在你调整参数时即时更新，方便你反复尝试不同设计，最后导出为 PNG 或 SVG。所有生成过程均在你浏览器内通过 qr-code-styling 库完成。
  useCases:
    - title: "品牌营销物料"
      description: "生成与品牌色匹配、中央嵌入 Logo 的二维码，导出为 SVG 用于海报、传单和产品包装等需要矢量图形的印刷物料。"
    - title: "数字到物理的链接"
      description: "将任意网址生成二维码，放在名片、活动现场指引牌或产品标签上，用户用手机扫码即可访问你的网站或社媒主页。"
    - title: "Wi-Fi 与联系方式分享"
      description: "将 Wi-Fi 网络凭据或联系信息（vCard 格式）编码为二维码，访客扫码自动连接 Wi-Fi，新朋友扫码即可添加通讯录。"
  technicalNotes:
    - "容错等级越高（Q、H），二维码即使部分被遮挡或损坏仍可读取，但会增加模块密度，使码看起来更密。"
    - "嵌入 Logo 时建议使用 Q 或 H 级容错，Logo 会覆盖部分模块，更高容错等级可补偿被遮挡的区域。"
    - "二维码颜色必须保持足够对比度，深色前景配浅色背景效果最佳，避免浅色前景配白色背景或深色前景配黑色背景。"
    - "SVG 导出生成的矢量图形可缩放到任意尺寸而不产生像素锯齿，非常适合印刷；PNG 更适合快速数字分享。"
    - "印刷用二维码建议最小尺寸为 2×2 厘米，屏幕显示建议至少 200×200 像素。"
  comparisons: |
    许多在线二维码生成器会在输出中添加水印、要求注册或限制生成数量。TUXIA 的生成器无限制、无水印、无需注册——所有样式调整和导出都在本地完成。不过 TUXIA 不追踪扫描分析数据，如果你需要扫码次数统计，可能需要专门的二维码管理平台。
  bestPractices:
    - "在打印或发布前，务必用至少两台不同手机（iOS 和 Android）测试二维码的扫描效果。"
    - "Logo 和印刷物料建议用 SVG 导出，快速数字分享用 PNG即可。"
    - "Logo 尺寸保持在二维码面积的 20% 以内，使用带透明背景的 PNG Logo，并留出足够边距。"

qrcode-dec:
  bestFor:
    - "识别截图、下载图片或照片里的二维码。"
    - "打开二维码链接前先查看真实内容。"
    - "复制识别出的文本，方便记录、排查或分享。"
  steps:
    - "上传清晰的二维码图片。"
    - "等待浏览器识别并显示二维码内容。"
    - "确认内容后复制结果或打开链接。"
  privacy: "二维码识别在浏览器本地完成，图片和识别结果不会上传到 TUXIA 服务器。"
  introduction: |
    二维码解码是二维码生成的配套工具——它读取隐藏在二维码图片中的内容。你可能会在截图、下载的图片、PDF 文件或别人发来的照片中碰到二维码。在用手机扫码之前，你可能想先看清二维码中究竟包含什么内容，尤其是当二维码来自不信任的来源时。TUXIA 的二维码解码器使用 jsQR 库分析上传的图片，提取其中嵌入的文本或 URL。工具会清晰展示结果，标注是 URL 还是纯文本，并分别提供复制内容和安全打开链接的按钮。
  useCases:
    - title: "安全验证"
      description: "在手机扫码前先用解码器查看实际 URL，有助于识别钓鱼链接、短网址背后的真实地址或可疑位置的二维码。"
    - title: "截图内容提取"
      description: "如果二维码以截图或 PDF 形式存在，上传到解码器就能提取其中的文本或链接，无需用另一台设备扫描屏幕。"
    - title: "排查生成问题"
      description: "用生成器制作二维码后，通过解码器验证编码内容是否正确，在打印或发布前发现错误。"
  technicalNotes:
    - "jsQR 库对清晰、正面拍摄且光线充足的二维码识别效果最佳，模糊、倾斜或部分遮挡的码可能无法解码。"
    - "二维码可编码 URL、纯文本、电话号码、邮箱地址、短信、Wi-Fi 凭据和 vCard 联系数据等多种类型。"
    - "解码器直接读取原始文本内容而不区分格式，仅对 URL 类型的内容提供「打开链接」按钮以便用户操作。"
  comparisons: |
    手机相机应用可以快速扫描二维码，但通常直接跳转到 URL 而不会让你先检查内容。TUXIA 的解码器在你采取行动前先展示原始内容，提供了安全缓冲层。对于批量解码或自动化流程，专用桌面软件效率更高，但临时检查一两个二维码，TUXIA 提供了最便捷的体验。
  bestPractices:
    - "在点击「打开链接」前务必检查解码出的 URL，尤其是来自不明来源的二维码。"
    - "使用清晰、正面的二维码图片，如果首次解码失败，尝试裁剪图片仅保留二维码区域或使用更高分辨率版本。"
    - "生成二维码后，用解码器做最终验证再分享或打印，这是预防返工的关键步骤。"

compress:
  bestFor:
    - "在上传网站、邮件或文档前减小 JPG、PNG 和 WebP 图片体积。"
    - "通过原图和压缩后对比检查画质变化。"
    - "根据使用场景选择 PNG、JPG、WebP 或 SVG 导出。"
  steps:
    - "上传 JPG、PNG 或 WebP 图片。"
    - "移动质量滑块，并查看压缩前后的预览对比。"
    - "选择导出格式并下载压缩后的图片。"
  privacy: "图片压缩使用浏览器 Canvas 能力在本地完成，所选图片不会上传到 TUXIA 服务器。"
  introduction: |
    图片压缩是优化网页性能、邮件送达率和存储管理最有效的措施之一。未压缩的大图片会拖慢页面加载、消耗移动流量、被邮件服务器拒收，还会塞满云存储空间。TUXIA 的图片压缩工具提供了左右对比的工作区，让你直观地看到压缩对画质的实时影响。上传 JPG、PNG 或 WebP 文件后，拖动 10% 到 100% 的质量滑块，即可在压缩预览与原图之间比较效果。工具会自动选择最佳压缩格式，并显示文件缩小的确切字节数和百分比。你还可以手动覆盖输出格式为 PNG、JPG、WebP 或 SVG。所有处理均使用浏览器的 Canvas API——原始图片始终留在你的设备上，绝不上传任何服务器。
  useCases:
    - title: "网页性能优化"
      description: "未优化的图片是页面加载缓慢的首要原因。在上传 CMS 前压缩产品图、头图与博客配图，每张减少 30-50% 体积能大幅降低整页重量。"
    - title: "邮件附件瘦身"
      description: "多数邮箱单封附件上限 25 MB，现代手机直出的照片动辄 5-10 MB，压缩后再附送可确保不被退信或被邮件系统自动缩小。"
    - title: "社媒与即时通讯"
      description: "社交平台和聊天应用上传时会自行压缩，质量不受你控制。先用 TUXIA 压缩能让你掌控质量与体积的取舍，分享得体又不浪费流量。"
  technicalNotes:
    - "JPEG 压缩是有损的——每次重新压缩都会永久丢失部分图像数据，建议保留未压缩母版，仅用压缩版分发。"
    - "WebP 压缩在同等视觉质量下通常比 JPEG 文件小 25-35%，大多数现代浏览器支持 WebP，但部分老旧邮件客户端不支持。"
    - "浏览器中的 PNG 压缩为无失真重编码，有时可产出更小的文件而无画质损失，尤其当原始 PNG 本身未经过优化时。"
    - "透明图片在格式转换时需注意：导为 JPEG 会添加白色背景，WebP 和 PNG 则保留透明通道。"
  comparisons: |
    TinyPNG 或 Compressor.io 等基于服务器的压缩工具通过云端处理提供类似效果，但需要你把图片上传给第三方。TUXIA 的压缩完全在浏览器内运行，处理大文件时更快速（无需等待上传）且更私密（服务器看不到你的图片）。ImageOptim 或 Photoshop 等桌面工具支持批量处理和更高级选项，但需要安装且并非所有设备都可用。
  bestPractices:
    - "质量从 80% 开始试调，逐步降低直到肉眼察觉明显劣化时回调 5-10%。"
    - "网页图片优先使用 WebP 格式，它在照片和混合内容图片上尺寸质量比最优。"
    - "文字密集的图片（截图、信息图）质量不要低于 60%，确保文字清晰可读。"
    - "如果压缩后反而变大（页面会有提示），说明原图已优化到位，可换格式或直接使用原图。"

convert:
  bestFor:
    - "将 PNG、JPG、WebP、BMP 等常见格式互相转换。"
    - "为网页、文档、邮件或素材交付准备合适的图片格式。"
    - "导出前先预览源图片，避免格式选择错误。"
  steps:
    - "上传浏览器支持的图片文件。"
    - "选择目标导出格式。"
    - "预览确认后下载转换后的文件。"
  privacy: "格式转换在浏览器本地完成，TUXIA 不会把图片上传到后端服务。"
  introduction: |
    不同平台和工作流程需要不同的图片格式。网站可能需要 WebP 优化性能，打印店可能要求将 JPG 转为 TIFF，邮件签名可能需要小体积 PNG，老旧系统可能只认 BMP。TUXIA 的图片格式转换器覆盖常见 Web 格式——PNG、JPG、WebP 和 BMP——外加 SVG 容器导出，一次上传即可在五种格式间选择。工具会预览你的源图片，确认转换对象无误后即可选择目标格式。转换在浏览器内通过 Canvas API 即时完成：将图片绘制到离屏 Canvas 上，再以选定格式导出。这意味着无需等待上传、不依赖服务器，且图片文件完全私密。
  useCases:
    - title: "前端开发格式切换"
      description: "将 PNG 截图和 JPG 照片转为 WebP 用于现代 Web 部署，在无肉眼可见画质损失的前提下将文件减小 25-35%。或把 WebP 转回 JPG 以兼容老旧浏览器。"
    - title: "文档与演示准备"
      description: "插入 Word 文档、PPT 演示或 PDF 报告前将图片转为通用兼容格式，JPG 是跨办公软件兼容性最安全的选择。"
    - title: "透明通道管理"
      description: "将带透明的 PNG 转 JPG 以获得实色背景，或将不透明 JPG 转 PNG 以保存精确像素数据避免压缩伪影。"
  technicalNotes:
    - "从有损格式（JPG、WebP）转为无损格式（PNG、BMP）不会恢复已丢失的画质，文件会变大但视觉效果与源一致。"
    - "SVG 导出选项是将位图包装在 SVG 容器内，并非矢量描摹——SVG 内仍包含原有位图数据。"
    - "BMP 是无压缩格式文件体积非常大，仅在特定老旧系统或应用要求时才使用。"
    - "转为 PNG 或 WebP 时透明通道会保留，转为 JPG 则透明部分替换为白底。"
  comparisons: |
    Adobe Photoshop 或 GIMP 等专业桌面软件提供了更多格式选项（TIFF、PSD、HEIC、RAW）和精细的导出设置。TUXIA 的转换器最适合在不需要或不方便打开桌面编辑软件时，快速完成常见 Web 格式间的单次转换。
  bestPractices:
    - "目标网站是现代页面时优先选 WebP，它在视觉质量不变的前提下体积最小。"
    - "需保留透明或图片中含文字和锐利线条时用 PNG，避免 JPEG 压缩伪影。"
    - "转换后务必预览下载文件再用于正式场合，尤其是涉及有损与无损格式互转时。"
    - "除非有明确要求，尽量不使用 BMP，它的体积远大于 PNG 而无任何质量优势。"

resize:
  bestFor:
    - "上传或发送前缩小大尺寸照片。"
    - "制作缩略图、头像、商品图和社媒配图。"
    - "按精确宽高或百分比缩放图片，并保持比例。"
  steps:
    - "上传图片并查看原始尺寸。"
    - "输入目标宽高，或选择快速缩放比例。"
    - "预览调整后的结果并下载。"
  privacy: "尺寸调整通过浏览器 Canvas 在本地完成，所选图片不会上传到 TUXIA 服务器。"
  introduction: |
    图片尺寸直接影响文件大小、加载速度以及图片在版式中的适配程度。现代智能手机拍摄的照片可能高达 4000×3000 像素，远超网站缩略图或社交媒体帖子的实际需求。TUXIA 的图片尺寸调整工具允许你指定精确的像素宽度和高度，或按百分比缩放。锁定宽高比的开关能确保你只改一个维度时不会意外拉伸或压扁图片。快速缩放预设（25%、50%、75%）提供了一键快捷操作。调整后的图片可导出为 PNG、JPG 或 WebP。与所有 TUXIA 工具一样，缩放处理在浏览器内通过 Canvas API 完成——你的原始图片不会离开设备。
  useCases:
    - title: "缩略图与预览生成"
      description: "为产品列表、博客摘要、视频封面或图片搜索结果创建统一尺寸的缩略图，标准尺寸（如 300×300）保证排版一致、加载更快。"
    - title: "社媒头像与封面"
      description: "各平台有推荐的图片尺寸——LinkedIn 头像 400×400、Facebook 封面 820×312、X/Twitter 题图 1500×500——将原图调整到平台期望的确切尺寸。"
    - title: "电商产品图统一"
      description: "大多数网店要求所有产品图尺寸一致以保证分类页整齐统一，在上传前将每张产品照调整到规定尺寸。"
  technicalNotes:
    - "放大超出原图尺寸会导致浏览器插值填补缺失像素，产生模糊或发虚的效果，缩放工具最适用于缩小而非放大。"
    - "宽高比锁开启后，改宽自动适配高，保持原始比例；关闭后可自由输入任意尺寸，但可能拉伸或压扁图片。"
    - "快速缩放预设（25%、50%、75%）按给定百分比同时缩放宽高，如 50% 作用于 2000×1000 的图片将产出 1000×500。"
  comparisons: |
    TUXIA 的尺寸调整工具专为快速、交互式调整并即时预览而优化。如需批量处理数十或数百张图片，Photoshop（图像处理器）、XnConvert 或 ImageMagick 命令行工具效率更高。在仅使用手机的流程中，TUXIA 的缩放工具无需安装任何应用，手机浏览器即可运行。
  bestPractices:
    - "多数情况下保持宽高比锁开启，仅在刻意改变比例时才解锁。"
    - "先调整尺寸再压缩——减小像素尺寸是最有效的瘦身手段，然后用压缩做精细调优。"
    - "调整前先查目标平台的推荐尺寸，不同社交网络、CMS 和电商平台各有具体要求。"

crop:
  bestFor:
    - "裁剪截图、照片、头像和商品图。"
    - "使用 1:1、4:3、16:9 等常用比例快速裁剪。"
    - "旋转图片并在导出前预览裁剪结果。"
  steps:
    - "上传图片并选择裁剪比例。"
    - "在画布上拖动或调整裁剪区域。"
    - "预览裁剪结果并下载图片。"
  privacy: "图片裁剪在浏览器本地完成，TUXIA 不会上传你的图片。"
  introduction: |
    裁剪的核心目的是移除图片中不需要的区域，从而改善构图、适配特定宽高比，或将视觉焦点集中在主体上。TUXIA 的图片裁剪工具提供了可视化画布编辑器，你可以在上传的图片上自由拖动裁剪框。预设比例包括——1:1（正方形，适合 Instagram 和头像）、4:3（标准照片比例）、16:9（宽屏，适合视频缩略图和演示文稿）、3:4、9:16（竖版视频）——还有自由比例供自定义尺寸。你还可以在裁剪前将图片顺时针或逆时针旋转 90°。画布实时预览裁剪效果，下载时裁剪区域以全分辨率导出。
  useCases:
    - title: "社媒内容创作"
      description: "将照片裁剪到各平台要求的宽高比——1:1 用于 Instagram 帖子、16:9 用于 YouTube 缩略图、9:16 用于故事和短视频，确保主体不被裁切。"
    - title: "产品摄影统一"
      description: "将电商产品照统一裁剪为一致比例（通常 1:1 或 4:3），保证分类页和搜索结果中所有商品排列整齐。"
    - title: "构图优化"
      description: "去掉干扰视线的背景元素，用三分法构图将主体居中或置于兴趣点，好的裁剪能让平庸的照片焕然一新。"
  technicalNotes:
    - "裁剪会永久删除选区外的像素，导出图片的尺寸即为裁剪框范围内映射至原图分辨率的精确像素。"
    - "裁剪前旋转图片会改变画布方向，旋转效果会体现在最终裁剪输出中。"
    - "裁剪框可通过拖拽移动位置、拖拽边缘或四角调整大小，点击画布空白处可重新绘制选区。"
  comparisons: |
    TUXIA 的裁剪器完全在浏览器内运行，交互画布反应灵敏。相比需要上传的服务端工具更快（无需等待上传），相比桌面编辑器更轻便。对于透视校正、内容感知裁剪或非破坏性裁剪等高级需求，Lightroom、Photoshop 或设备自带的照片应用提供了更强大的能力。
  bestPractices:
    - "先选定宽高比再调整裁剪区域，这样输出尺寸一定符合目标要求，无需事后猜测。"
    - "为社媒裁剪时，在被摄主体周围留少量边距——部分平台会对预览缩略图施加额外裁切。"
    - "如果日后可能用到被裁掉的部分，裁剪前保留原始图片备份，裁剪操作不可撤销。"

watermark:
  bestFor:
    - "添加品牌文字、作者名称、草稿标记或版权说明。"
    - "应用单个水印、1 行、2 行、3 行或满屏重复水印。"
    - "使用文字水印或上传小尺寸图片水印。"
  steps:
    - "上传需要添加水印的图片。"
    - "输入水印文字，或选择图片水印。"
    - "调整位置、排列、字号、透明度、旋转和颜色后下载。"
  privacy: "水印处理在浏览器本地完成，所选图片不会上传到 TUXIA 服务器。"
  introduction: |
    水印为图片添加可见覆盖层，用于品牌标识、版权声明、草稿标记或阻止未授权使用。TUXIA 的图片水印工具支持两种水印类型：文字水印（自定义文本，可调整字体、字号、颜色、透明度和旋转角度）和图片水印（上传 Logo 或图形 PNG，可调整大小、透明度和位置）。你可以在五种布局模式中选择——四角或中央的单个水印，或重复排列行（1行、2行、3行或满屏平铺）。所有调整在画布上实时预览，保证你看到的水印效果与导出完全一致。加水印的图片完全在浏览器内合成——原图和水印图片均不会上传到任何服务器。
  useCases:
    - title: "品牌与版权保护"
      description: "分享照片前添加半透明的品牌名、Logo 或网址作为水印，虽非绝对防盗，但可作为可见的警示，也能追溯未授权的转载来源。"
    - title: "草稿与审阅标记"
      description: "在未定稿的设计稿、效果图或敏感文件上覆盖「草稿」「预览」「机密」等文字水印，再分享给客户或审阅者。"
    - title: "作品集与社媒署名"
      description: "摄影师和设计师可在作品角落添加低调的个人水印，即使图片被无署名转发，观众仍能看到作者信息。"
  technicalNotes:
    - "满屏和多行平铺水印比单角水印保护强度高得多，角落水印很容易被裁掉，而满屏平铺则极难去除。"
    - "图片水印（Logo）最好使用透明背景的 PNG，透明度控制会均匀作用于整个水印图片。"
    - "水印文字颜色需与底图形成对比，对于背景多变的图片，可考虑半透明白色或黑色文字搭配对比阴影。"
  comparisons: |
    TUXIA 的水印工具采用本地优先设计，你的图片和水印素材从不出浏览器，相对云端水印工具有明显隐私优势。但如果需要批量为数百张照片添加水印，Lightroom 的导出水印功能或 ImageMagick 命令行工具效率更高。
  bestPractices:
    - "水印透明度设在 30-50%——足以看清却不至于毁掉观看体验。"
    - "保护品牌选满屏平铺布局，展示作品集选角落单个小水印。"
    - "如果用图片水印（Logo），上传透明背景的 PNG，工具直接叠加不处理背景。"
    - "在预期展示尺寸下测试水印效果，全分辨率下可辨的水印缩小后可能完全看不清。"

retouch:
  bestFor:
    - "用马赛克遮挡隐私区域，如车牌、二维码、文字或头像。"
    - "对小范围视觉瑕疵做轻量修复。"
    - "导出不含敏感局部信息的分享版本。"
  steps:
    - "上传图片并选择局部擦除或马赛克模式。"
    - "调整画笔大小和强度，在目标区域涂抹。"
    - "预览结果并下载处理后的图片。"
  privacy: "局部擦除和马赛克都在浏览器本地完成，所选图片不会上传到 TUXIA 服务器。"
  introduction: |
    公开分享图片时，有时需要模糊掉敏感信息——人群照片中的面部、车辆照片中的车牌、文档上的电话号码或收据上的信用卡号。TUXIA 的局部修饰与马赛克工具提供两种模式：轻量修复（针对小瑕疵或干扰物体，通过像素混合来平滑涂抹区域）和马赛克遮盖（用于隐私保护，施加像素化网格来模糊细节）。你使用可调大小的画笔涂抹目标区域，选择模式后应用效果。结果会以新图片的形式下载，编辑内容已合成到图片中。所有处理均在 Canvas 上本地完成，敏感图片不会离开你的设备。
  useCases:
    - title: "分享前的隐私保护"
      description: "将截图、照片或文档扫描件中的人脸、车牌、门牌号、邮箱地址、电话号码等个人信息像素化后再发布或转发给他人。"
    - title: "小瑕疵清理"
      description: "用轻量修复模式去除照片上细小的灰尘斑点、皮肤瑕疵、杂散发丝或轻微传感器污点，适合小范围孤立瑕疵而非大面积涂改。"
    - title: "敏感文档遮盖"
      description: "在文档照片上对机密文字、账号、签名或二维码片段施加马赛克，留作参考或提交工单时保护隐私。"
  technicalNotes:
    - "修复模式使用像素级混合，从涂抹区域周围采样并尝试平滑过渡，效果取决于图片内容和画笔大小。"
    - "马赛克强度控制像素块的粒度，强度越高块越大，遮盖效果越强。"
    - "这不是 AI 智能填充，工具仅使用简单的 Canvas 像素操作。复杂对象的移除或大面积重建请使用具有 AI 能力的专业工具。"
    - "最大支持的图片尺寸为 10 MB，以确保画笔交互和处理的流畅性。"
  comparisons: |
    TUXIA 的修饰工具提供了无需上传的基础浏览器内局部编辑，擅长隐私遮盖和小瑕疵修补。对于专业修图——AI 物体移除、内容感知填充、皮肤磨皮或复杂合成——Photoshop、GIMP 或在线 AI 编辑器提供了强大得多的功能。TUXIA 的优势在于隐私和简洁：无需账号、无需上传、即时完成常见隐私处理任务。
  bestPractices:
    - "马赛克模式建议画笔大小略大于目标区域，一两笔即可覆盖，点击应用按钮后生效。"
    - "修复模式画笔大小尽量接近瑕疵尺寸，大面积涂抹会产生不自然的模糊区域。"
    - "下载前务必以原尺寸预览结果，马赛克可能留边，确保画笔完全覆盖了目标。"
    - "仅处理你拥有使用权的图片，对包含未经同意者的照片施加遮盖时尊重他人隐私。"

palette:
  bestFor:
    - "从商品图、截图或设计稿中提取主色。"
    - "在图片预览上悬停读取实时颜色。"
    - "复制 HEX、RGB、HSL 或 CSS 变量格式。"
  steps:
    - "上传图片并生成配色板。"
    - "在预览图上移动鼠标，查看当前位置颜色。"
    - "切换颜色格式，复制单个颜色或整组配色。"
  privacy: "取色和配色提取都在浏览器本地完成，TUXIA 不会上传你的图片。"
  introduction: |
    色彩是视觉设计中最有力的元素之一，从图片中提取合适的颜色可以为品牌配色、网站主题或 UI 组件库提供灵感。TUXIA 的图片取色工具兼具两大功能：通过对主色调和颜色分布的分析，从上传图片中提取一组有代表性的 6 色配色板；同时在图片预览上提供实时悬停取色，读取光标所在位置的精确像素颜色。颜色以四种格式展示——HEX（如 #3B82F6）、RGB（rgb(59, 130, 246)）、HSL（hsl(217, 91%, 60%)）和 CSS 自定义属性（--color: #3B82F6）——每种格式均可一键复制。配色板和取色功能完全在浏览器中运行，你的图片不会上传。
  useCases:
    - title: "品牌色提取"
      description: "上传 Logo、主视觉图或情绪板照片，提取定义品牌视觉特征的主色调，将 HEX 值直接复制到品牌规范文档或 CSS 变量文件中。"
    - title: "UI 与网页设计"
      description: "从头图、插画或产品照中提取配色，为按钮、强调色、背景和文字创建与主打图片自然协调的界面配色方案。"
    - title: "艺术与摄影分析"
      description: "通过提取和对比配色来研究艺术作品、摄影或设计参考的色彩构成，理解专业图片如何平衡冷暖色调、饱和度和对比度。"
  technicalNotes:
    - "HEX 格式（#RRGGBB）是网页和 CSS 中使用最广泛的颜色格式，每对字符分别代表红、绿、蓝的十六进制值。"
    - "RGB 格式以 0-255 的红绿蓝数值表示颜色，便于 JavaScript 和 Canvas 编程操作。"
    - "HSL 格式（色相、饱和度、亮度）对设计师更直观——色相是色轮角度 (0-360)、饱和度是色彩强度 (0-100%)、亮度是明暗 (0-100%)。"
    - "如果图片颜色范围较窄，提取的配色板可能出现相近色，要获得多样配色请使用色彩丰富、变化多样的图片。"
  comparisons: |
    浏览器扩展和专用取色器应用可以从屏幕任意位置采样，跨应用工作流更强大。但 TUXIA 的工具将配色提取和实时像素取色集成在一个无需安装的工作区中。对于精细色彩分级、ICC 配置文件管理或印刷色空间（CMYK），Adobe Color 或 Capture One 等专业工具更为合适。
  bestPractices:
    - "按工作流程在 HEX、RGB 和 HSL 间切换——前端开发者常用 HEX，UI 设计师更偏好 HSL，Canvas/JS 开发者用 RGB。"
    - "构建完整配色方案时使用「复制全部」按钮一键获取六个配色。"
    - "颜色采样准确性取决于你的浏览器和显示器校准，颜色在其他屏幕上可能呈现不同效果。"
    - "提取配色板前先用悬停取色检查兴趣区域的像素颜色，验证后再正式提取。"

exif:
  bestFor:
    - "查看 JPEG 照片中的相机型号和拍摄参数。"
    - "检查图片尺寸、时间、光圈、快门、ISO 和基础元数据。"
    - "发布前确认照片是否包含 GPS 位置信息。"
  steps:
    - "上传 JPEG 照片或浏览器支持的图片文件。"
    - "查看图片预览和提取到的元数据字段。"
    - "根据结果判断是否需要另行移除敏感元数据。"
  privacy: "EXIF 读取在浏览器本地完成，TUXIA 不会上传你的照片。"
  introduction: |
    每张数码照片里不只有像素，还藏着记录拍摄方式、时间和地点的元数据。EXIF（可交换图像文件格式）元数据由相机和智能手机嵌入 JPEG 和 TIFF 文件中，存储着相机型号、镜头、曝光参数（光圈、快门速度、ISO）、拍摄日期和时间、GPS 坐标、图像方向，以及编辑照片所用的软件等信息。TUXIA 的 EXIF 元数据查看器使用 exif.js 库读取这些数据，以清晰易读的格式与图片预览一同展示，同时显示图片尺寸和文件类型等基础文件信息。了解照片的元数据对于隐私保护意识、摄影工作流程分析和验证图片真实性至关重要。
  useCases:
    - title: "分享前隐私检查"
      description: "智能手机和许多相机默认将 GPS 坐标嵌入照片中。在网上或发给他人之前用 EXIF 查看器检查是否存在 GPS 数据，如果暴露了你的住址或当前位置，应先清除元数据再分享。"
    - title: "摄影技术复盘"
      description: "查看过往拍摄的曝光参数（光圈、快门、ISO），分析哪些设置拍出了好片哪些不理想，在多张照片间对比元数据以发现拍摄风格规律或诊断曝光问题。"
    - title: "图片真实性验证"
      description: "检查拍摄日期、相机型号和编辑软件字段，验证关于照片拍摄时间和方式的声明，有助于发现被编辑过或被歪曲呈现的图片。"
  technicalNotes:
    - "EXIF 数据最常见于 JPEG 和 TIFF 文件，PNG 和 WebP 通常不含 EXIF 元数据，部分工具可能以非标准方式嵌入。"
    - "许多社交平台和聊天应用会在你上传或分享图片时自动清除 EXIF 元数据，截图、AI 生成图和重度编辑导出通常也无 EXIF。"
    - "EXIF 中的 GPS 坐标以度、分、秒格式存储，可包含海拔信息，一旦存在就能相当精确地定位拍摄地点。"
    - "「软件」字段常显示最后编辑照片使用的程序，如 Adobe Photoshop、Lightroom 或手机内置编辑器。"
  comparisons: |
    操作系统文件管理器（Windows 文件属性、macOS 预览检查器）无需任何工具即可显示基础 EXIF 数据。ExifTool（命令行）或 PhotoME 等专用 EXIF 查看器提供了详尽的元数据覆盖，包括制造商标记。TUXIA 的查看器聚焦于最常用的字段，在浏览器中即时运行无需安装。
  bestPractices:
    - "在网上分享个人照片前务必检查 EXIF 元数据，尤其是居家拍摄的照片，如涉及位置隐私应及时清除 GPS 数据。"
    - "如果相机时钟设置错误，EXIF 中的拍摄时间也会不准，判断元数据可靠性时需考虑这一点。"
    - "如照片完全无 EXIF 数据，可能是被有意或自动移除——经聊天应用分享的图片常见此情况——不必惊讶。"

base64:
  bestFor:
    - "把 PNG、JPG、WebP、SVG、GIF 或 BMP 圖片轉換成 Base64 Data URL。"
    - "貼上 Base64 圖片文字後預覽還原結果，檢查編碼是否可用。"
    - "複製圖片 Data URL，用於 CSS、HTML、郵件範本、文件或測試資料。"
  steps:
    - "把圖片拖入左側區域，頁面會產生 Base64 Data URL。"
    - "把 Base64 文字貼到右側區域，預覽解碼後的圖片。"
    - "確認結果後複製編碼，或按需要下載還原後的圖片。"
  privacy: "Base64 編碼和解碼都在瀏覽器本機完成，TUXIA 不會把圖片或貼上的 Base64 文字上傳到伺服器。"
  introduction: |
    Base64 編碼是將二進位圖片資料轉換為純文字字串的技術，讓圖片可以直接嵌入 HTML、CSS、JSON 或其他文字格式中。這在需要將圖片打包進單一檔案時特別實用，例如自包含的 HTML 郵件範本、單檔案網頁元件，或是無法使用外部圖片參照的 CSS 拼貼。TUXIA 的圖片 Base64 工作區提供雙面板介面：左側面板可將任何圖片轉換為 Base64 Data URL，並自動顯示字元數和預估檔案大小；右側面板則可貼上任何 Base64 字串，即時解碼並預覽還原後的圖片。兩項操作均使用瀏覽器的 FileReader 和 Canvas API 在本機執行，你的圖片檔案和 Base64 字串都不會離開你的裝置。
  useCases:
    - title: "CSS 與 HTML 內嵌"
      description: "小型圖示、標誌和裝飾元素可以直接以 Base64 Data URL 嵌入 CSS 或 HTML，省去額外的 HTTP 請求，特別適用於單頁應用程式、郵件範本和離線網頁應用。"
    - title: "API 資料傳輸"
      description: "透過 REST API 或 GraphQL 傳送圖片資料時，Base64 編碼提供安全的文字格式，能在 JSON 序列化過程中避免二進位損毀，常用於頭像上傳、文件附件或圖片標註流程。"
    - title: "除錯與測試"
      description: "Base64 輸出方便在日誌檔案中檢查圖片資料、比較不同格式的編碼結果，或建立可重複使用的測試案例，也可貼上 Base64 文字來驗證圖片是否正確解碼。"
  technicalNotes:
    - "Base64 編碼會使檔案大小比原始二進位資料增加約 33%。對於大型照片，這個額外負擔會相當可觀，一張 1 MB 的圖片會變成約 1.33 MB 的字串。"
    - "並非所有瀏覽器都能高效處理文字框中的超長 Base64 字串。超過 2-3 MB 的圖片建議改用直接檔案傳輸。"
    - "`data:image/` 前綴用來指定 MIME 類型，TUXIA 會根據偵測到的圖片格式自動加入正確的前綴。"
    - "解碼 Base64 時，任何以 `data:image/` 開頭的字串都會被視為完整的 Data URL；不含前綴的原始 Base64 文字則預設以 PNG 格式解碼。"
  comparisons: |
    相較於可能記錄圖片資料或限制上傳大小的伺服器端 Base64 轉換工具，TUXIA 的工具全部在瀏覽器本機處理，沒有來自 TUXIA 端的檔案大小限制（僅受瀏覽器記憶體限制），而且無需等待上傳即可即時轉換。但 Base64 編碼本身不會壓縮圖片，若檔案大小是你的主要考量，建議先使用 TUXIA 的圖片壓縮工具再進行編碼。
  bestPractices:
    - "盡量將 Base64 編碼的圖片控制在 10 KB 以下。小型圖示、標誌和內嵌圖形是最適合的對象，全解析度照片則不建議。"
    - "將 Base64 用於首屏上方、需要避免額外 HTTP 請求而阻擋渲染的圖片。"
    - "在 CSS 中嵌入 Base64 時，將其放在樣式表末端或內聯 `<style>` 區塊中，避免阻擋關鍵 CSS 的載入。"
    - "在正式環境使用 Base64 字串前，務必先測試解碼後的圖片，確認尺寸、顏色和透明度都正確無誤。"

online:
  bestFor:
    - "使用你自己的 ImgBB API Key 上傳圖片並產生公開連結。"
    - "產生可複製、可分享的圖片 URL，用於臨時分享或跨裝置查看。"
    - "保持上傳路徑透明：瀏覽器直接請求 ImgBB，不經過 TUXIA 伺服器。"
  steps:
    - "在設定區填寫你的 ImgBB API Key。"
    - "選擇圖片並在頁面中預覽檔案資訊。"
    - "點擊上傳後複製返回的圖片連結。"
  privacy: "這是唯一會把圖片送到第三方的工具。只有你點擊上傳後，瀏覽器才會使用你的 API Key 直接把圖片送到 ImgBB。"
  introduction: |
    雖然大多數 TUXIA 工具都在本機處理圖片、完全不涉及網路請求，但圖片連結產生器服務的是一個獨特的需求：為圖片建立一個可公開存取的連結。當你需要在論壇分享圖片、嵌入聊天訊息、傳送給無法接收附件的對象，或是在不自行架設圖片主機的情況下展示圖片時，這個工具就非常實用。此工具使用 ImgBB API，需要你提供自己的 API Key（可從 ImgBB 免費取得）。設定完成後，你的瀏覽器會直接將圖片傳送至 ImgBB，並返回可直接複製分享的圖片直連網址和檢視頁面網址。TUXIA 不會代理、儲存或檢視上傳的圖片，整個連線僅發生在你的瀏覽器和 ImgBB 之間。
  useCases:
    - title: "免附件快速分享"
      description: "不需要用電子郵件寄送大型圖片附件，也不必擔心即時通訊軟體壓縮畫質，上傳圖片即可取得分享連結，收件者打開連結就能看到原始畫質的圖片。"
    - title: "跨裝置傳輸"
      description: "從桌上型電腦上傳圖片，然後在手機、平板或其他裝置上打開產生的連結，不需要傳輸線、雲端同步或通訊軟體。"
    - title: "臨時素材交付"
      description: "設計師和開發者可以透過臨時公開連結，將草稿圖片、模型圖或螢幕截圖分享給客戶或團隊成員，無需將檔案提交到永久託管平台。"
  technicalNotes:
    - "ImgBB API Key 是免費的，可從你的 ImgBB 帳號儀表板建立。API Key 僅儲存在瀏覽器的 localStorage 中，不會存放於任何 TUXIA 伺服器。"
    - "上傳限制取決於你的 ImgBB 帳號等級。免費帳號通常允許單一檔案最大 32 MB。"
    - "圖片會透過 HTTPS 從你的瀏覽器傳送到 ImgBB 的 API 端點，TUXIA 的靜態網站無法攔截或修改此請求。"
    - "產生的連結是公開的，任何持有該連結的人都可以檢視圖片。請勿使用此工具處理私人、敏感或機密的圖片。"
  comparisons: |
    相較於需要建立帳號和管理資料夾的雲端儲存服務（如 Google Drive、Dropbox），圖片連結產生器只需一個步驟就能建立直接且匿名的圖片連結。然而，ImgBB 連結可能會依據其保留政策而過期或被移除。如果需要永久託管，建議考慮專門的圖片託管服務或自行架設網頁伺服器。
  bestPractices:
    - "上傳前務必預覽圖片，確認是正確的檔案且不含無意公開的中繼資料。"
    - "先使用 TUXIA 的其他工具處理圖片，例如先壓縮或調整尺寸再上傳，以減少上傳時間和頻寬消耗。"
    - "將你的 ImgBB API Key 儲存在瀏覽器設定面板中，省去每次重新輸入的麻煩。"
    - "將重要的 ImgBB 檢視頁面網址加入書籤，因為 ImgBB 最終可能會移除免費帳號中的圖片。"

qrcode-gen:
  bestFor:
    - "把網址、文字或短訊息產生 QR Code。"
    - "自訂 QR Code 尺寸、容錯等級、前景色、背景色、點樣式和 Logo。"
    - "匯出 PNG 或 SVG，用於網頁、印刷和營運素材。"
  steps:
    - "輸入需要編碼的文字或連結。"
    - "調整尺寸、容錯等級、顏色、樣式和可選 Logo。"
    - "預覽 QR Code 並選擇 PNG 或 SVG 下載。"
  privacy: "QR Code 產生在瀏覽器本機完成，你輸入的文字不會送到 TUXIA 伺服器。"
  introduction: |
    QR Code 已成為連接實體世界和數位內容的重要橋樑，出現在產品包裝、餐廳菜單、活動票券、名片和行銷素材等各種場合。TUXIA 的 QR Code 產生器讓你能完全掌控 QR Code 的外觀，同時確保其可掃描性。你可以調整尺寸（以像素為單位）、選擇四種容錯等級（L、M、Q、H）、自訂前景色和背景色、切換方形點和圓角樣式、修改角落圖案，還可選擇性地在中央嵌入標誌圖示。即時預覽會在你做出變更時立即更新，方便你在匯出 PNG 或 SVG 前嘗試不同的設計。所有產生過程都在瀏覽器本機中執行，使用 qr-code-styling 程式庫。
  useCases:
    - title: "品牌行銷素材"
      description: "建立符合品牌色彩並在中央嵌入標誌的 QR Code。匯出 SVG 用於印刷品如傳單、海報和產品包裝，利用可縮放向量圖形確保印刷品質。"
    - title: "實體到數位連結"
      description: "從任何網址產生 QR Code，放在名片、活動標示或產品標籤上。使用者用手機相機掃描後即可立即造訪你的網站、社群媒體或登陸頁面。"
    - title: "Wi-Fi 與聯絡人分享"
      description: "將 Wi-Fi 網路憑證或聯絡資訊（vCard 格式）編碼到 QR Code 中。訪客掃描後即可自動連線 Wi-Fi，新聯絡人掃描後可將你加入通訊錄，省去手動輸入的麻煩。"
  technicalNotes:
    - "較高的容錯等級（Q、H）能讓 QR Code 在被部分遮蓋或損壞時仍可讀取，但會增加模組數量，使圖案更密集。"
    - "嵌入標誌時請使用 Q 或 H 容錯等級。標誌會遮蓋部分 QR Code 模組，較高的容錯等級可以補償被遮蓋的區域。"
    - "QR Code 顏色必須保持足夠的對比度。深色前景搭配淺色背景效果最佳，避免淺色配白色背景或深色配黑色背景。"
    - "SVG 匯出會產生可縮放至任何尺寸而不失真的向量輸出，非常適合印刷；PNG 匯出則適合快速數位分享。"
    - "印刷用的 QR Code 建議最小尺寸為 2 × 2 公分，數位顯示則以 200 × 200 像素為實用下限。"
  comparisons: |
    許多線上 QR Code 產生器會加上浮水印、要求註冊或限制產生數量。TUXIA 的產生器沒有限制、沒有浮水印，也不需要註冊，所有樣式設定和匯出都在本機執行。不過，TUXIA 不追蹤掃描分析資料，如果你需要掃描次數統計，可能需要使用專門的 QR Code 管理平台。
  bestPractices:
    - "在印刷或發布前，務必使用至少兩支不同的手機（iOS 和 Android）實際掃描測試 QR Code。"
    - "標誌、印刷品和任何需要縮放的情況使用 SVG 匯出，快速數位分享使用 PNG。"
    - "標誌尺寸保持在 QR Code 面積的 20% 以下，使用透明背景的 PNG 標誌，並保留足夠的內邊距。"
    - "在淺色和深色模式下都測試顏色組合，確保對比度在不同顯示條件下都能正常運作。"

qrcode-dec:
  bestFor:
    - "辨識截圖、下載圖片或照片裡的 QR Code。"
    - "打開 QR Code 連結前先查看真實內容。"
    - "複製辨識出的文字，方便記錄、排查或分享。"
  steps:
    - "上傳清晰的 QR Code 圖片。"
    - "等待瀏覽器辨識並顯示 QR Code 內容。"
    - "確認內容後複製結果或打開連結。"
  privacy: "QR Code 辨識在瀏覽器本機完成，圖片和辨識結果不會上傳到 TUXIA 伺服器。"
  introduction: |
    QR Code 解碼是產生的互補功能，用來讀取隱藏在 QR Code 圖片中的內容。你可能會在螢幕截圖、下載的圖片、PDF 文件或他人傳送的照片中遇到 QR Code。在使用手機掃描之前，你可能想先預覽 QR Code 實際包含的內容，特別是當該 QR Code 來自不受信任的來源時。TUXIA 的 QR Code 解碼器使用 jsQR 程式庫分析上傳的圖片，並擷取其中嵌入的文字或網址。工具會清楚顯示結果，標明是網址還是純文字，並提供複製內容或檢查後安全開啟連結的按鈕。
  useCases:
    - title: "安全檢查驗證"
      description: "在用手機相機掃描 QR Code 之前，先解碼查看實際網址，幫助你識別釣魚攻擊、隱藏真實目的地的短網址，或放置於可疑位置的 QR Code。"
    - title: "從截圖擷取內容"
      description: "如果你收到的 QR Code 是螢幕截圖或 PDF 檔案，上傳到解碼器即可擷取嵌入的文字或連結，不需要用另一台裝置掃描螢幕。"
    - title: "檢查已產生的 QR Code"
      description: "使用產生器建立 QR Code 後，再用解碼器驗證是否編碼了正確的內容，在印刷或發布前及早發現錯誤。"
  technicalNotes:
    - "jsQR 程式庫對於清晰、光線良好且正面的 QR Code 效果最佳。模糊、歪斜或部分遮蓋的 QR Code 可能無法成功解碼。"
    - "QR Code 可以編碼網址、純文字、電話號碼、電子郵件地址、簡訊、Wi-Fi 憑證和 vCard 聯絡人資料。"
    - "解碼器會讀取原始文字內容，不限格式。除了為網址提供「開啟連結」按鈕外，不會區分網址和非網址文字。"
  comparisons: |
    手機相機應用程式可以快速掃描 QR Code，但通常會直接導向網址而不讓你先行檢查。TUXIA 的解碼器會先顯示原始內容再讓你操作，提供了一層安全保障。對於批次解碼或自動化工作流程，專業桌面軟體可能更有效率，但對於快速的單次檢查，TUXIA 提供了最簡單的使用體驗。
  bestPractices:
    - "點擊「開啟連結」前務必先檢查解碼後的網址，尤其是來自不明來源的 QR Code。"
    - "使用清晰且正面的 QR Code 圖片。如果第一次解碼失敗，請嘗試將圖片裁切到僅含 QR Code 區域，或使用更高解析度的版本。"
    - "如果你正在產生 QR Code，請將解碼作為分享或印刷前的最終驗證步驟。"

compress:
  bestFor:
    - "在上傳網站、郵件或文件前減小 JPG、PNG 和 WebP 圖片大小。"
    - "透過原圖和壓縮後對比檢查畫質變化。"
    - "依照使用情境選擇 PNG、JPG、WebP 或 SVG 匯出。"
  steps:
    - "上傳 JPG、PNG 或 WebP 圖片。"
    - "移動品質滑桿，並查看壓縮前後的預覽對比。"
    - "選擇匯出格式並下載壓縮後的圖片。"
  privacy: "圖片壓縮使用瀏覽器 Canvas 能力在本機完成，所選圖片不會上傳到 TUXIA 伺服器。"
  introduction: |
    圖片壓縮是你能為網頁效能、郵件送達率和儲存空間管理所做的最有效優化之一。大型未壓縮的圖片會拖慢頁面載入速度、消耗行動數據流量、被郵件伺服器拒絕，還會佔滿雲端儲存空間。TUXIA 的圖片壓縮工具提供左右對比的工作區，讓你即時查看壓縮對圖片的實際影響。上傳 JPG、PNG 或 WebP 檔案後，調整 10% 到 100% 的品質滑桿，即可立即看到壓縮後的預覽與原圖並排對比。工具會自動選擇最佳的壓縮格式（支援 WebP 時優先使用、JPEG 用於照片、PNG 用於含透明度的圖形），並顯示精確的檔案大小減少量（以位元組和百分比呈現）。你也可以手動將輸出格式設為 PNG、JPG、WebP 或 SVG 再下載。所有處理都使用瀏覽器的 Canvas API，原始圖片檔案始終留在你的裝置上，不會上傳到任何伺服器。
  useCases:
    - title: "網站效能優化"
      description: "未優化的圖片是頁面載入緩慢的主因。上傳到 CMS 之前先壓縮產品照片、主視覺圖片和部落格插圖，即使每張圖片只減少 30-50% 的大小，也能大幅降低整體頁面重量。"
    - title: "郵件附件瘦身"
      description: "大多數郵件服務商將附件上限設為 25 MB。現代手機相機拍出的照片動輒 5-10 MB，先壓縮再附加到郵件，確保收件者能順利收到，不會被退信或自動降質。"
    - title: "社群媒體與即時通訊"
      description: "社群平台和即時通訊應用程式會在上傳時自行壓縮，往往不可預測地降低畫質。使用 TUXIA 預先壓縮能讓你掌控品質與大小的取捨，分享時既好看又不浪費頻寬。"
  technicalNotes:
    - "JPEG 壓縮是有損的，每次重新壓縮都會永久丟棄部分影像資料。基於存檔目的，請保存未壓縮的主檔案，並為散佈用途建立壓縮版本。"
    - "WebP 壓縮通常在同等視覺品質下比 JPEG 小 25-35%。大多數現代瀏覽器支援 WebP，但部分舊版郵件用戶端和應用程式不支援。"
    - "瀏覽器中的 PNG 壓縮是無損的，TUXIA 會重新編碼 PNG，有時能在不失真的情況下產生更小的檔案，尤其是原始 PNG 未經優化時。"
    - "含有透明度（Alpha 通道）的圖片在轉換時會謹慎處理：JPEG 輸出會加上白色背景，WebP 和 PNG 則保留透明度。"
  comparisons: |
    像 TinyPNG 或 Compressor.io 等伺服器端壓縮工具透過雲端處理提供類似的品質，但需要將圖片上傳到第三方伺服器。TUXIA 的壓縮工具完全在瀏覽器中執行，處理大型檔案更快（無需等待上傳）且更隱私（伺服器永遠看不到你的圖片）。桌面工具如 ImageOptim 或 Photoshop 提供批次處理和更多進階選項，但需要安裝軟體且並非所有裝置都能使用。
  bestPractices:
    - "先從 80% 品質開始，預覽結果後逐步降低品質，直到發現明顯的畫質劣化，再往回調整 5-10%。"
    - "網頁圖片優先使用 WebP 格式，它在照片和混合內容圖形上提供最佳的尺寸與畫質比。"
    - "文字密集的圖片（螢幕截圖、資訊圖表）品質保持在 60% 以上，確保文字保持清晰可讀。"
    - "如果壓縮後的檔案反而比原始檔案大（工具會以中性提示告知），表示圖片已經充分優化，可嘗試不同輸出格式或接受原始版本。"

convert:
  bestFor:
    - "將 PNG、JPG、WebP、BMP 等常見格式互相轉換。"
    - "為網頁、文件、郵件或素材交付準備合適的圖片格式。"
    - "匯出前先預覽來源圖片，避免格式選擇錯誤。"
  steps:
    - "上傳瀏覽器支援的圖片檔案。"
    - "選擇目標匯出格式。"
    - "預覽確認後下載轉換後的檔案。"
  privacy: "格式轉換在瀏覽器本機完成，TUXIA 不會把圖片上傳到後端服務。"
  introduction: |
    不同的平台和工作流程需要不同的圖片格式。網站可能為了效能而需要 WebP，印刷廠可能要求 TIFF（需從 JPG 轉換），郵件簽名檔可能需要小型 PNG，而舊版系統可能只接受 BMP。TUXIA 的圖片格式轉換器涵蓋常見的網頁格式——PNG、JPG、WebP 和 BMP——外加 SVG 封裝匯出，全部只需一次上傳即可完成。工具會預覽你的來源圖片，讓你確認正在轉換的是正確的檔案，然後從五種輸出格式中選擇。轉換在瀏覽器中即時完成，使用 Canvas API：圖片被繪製到螢幕外的 Canvas 上，再以所選格式匯出。這意味著沒有上傳等待時間、不依賴伺服器，且你的圖片檔案完全隱私。
  useCases:
    - title: "網頁開發格式切換"
      description: "將 PNG 螢幕截圖和 JPG 照片轉換為 WebP 以部署到現代網站，在不損失視覺品質的同時減少 25-35% 的檔案大小。或將 WebP 圖片轉回 JPG 以相容舊版瀏覽器、郵件用戶端和不支援 WebP 的 CMS。"
    - title: "文件與簡報準備"
      description: "將圖片轉換為普遍相容的格式後再插入 Word 文件、PowerPoint 簡報或 PDF 報告，JPG 是跨辦公室軟體相容性最安全的選擇。"
    - title: "透明度管理"
      description: "將含透明度的 PNG 圖片轉換為 JPG 以獲得純色背景，或將不透明的 JPG 圖片轉換為 PNG 以保留精確的像素資料，避免壓縮失真。"
  technicalNotes:
    - "從有損格式（JPG、WebP）轉換為無損格式（PNG、BMP）不會還原已遺失的品質，轉換後的檔案會變大，但外觀與原始檔案相同。"
    - "SVG 匯出選項是將點陣圖片封裝在 SVG 容器內，並不會將點陣圖向量化或描摹，SVG 內部仍包含原始點陣資料作為嵌入式圖片。"
    - "BMP 是未壓縮的格式，會產生非常大的檔案。只有在舊版系統或應用程式有特定要求時才使用 BMP。"
    - "轉換為 PNG 或 WebP 時會保留 Alpha 透明度；轉換為 JPG 時則以白色背景取代透明區域。"
  comparisons: |
    專業桌面工具如 Adobe Photoshop 或 GIMP 提供更多格式選擇（TIFF、PSD、HEIC、RAW）和細緻的匯出設定。TUXIA 的轉換器最適合在沒有桌面編輯軟體或不願開啟時，快速進行常見網頁格式之間的單次轉換。
  bestPractices:
    - "當目標是現代網站時，選擇 WebP 作為輸出格式，它能在視覺品質和檔案大小之間取得最佳平衡。"
    - "需要保留透明度或圖片包含文字和銳利線條（容易出現 JPEG 失真）時，使用 PNG 格式。"
    - "轉換後務必預覽下載的檔案再投入正式使用，特別是在有損和無損格式之間轉換時。"
    - "除非有特定需求，否則避免使用 BMP，它產生的檔案極大且品質相較於 PNG 沒有優勢。"

resize:
  bestFor:
    - "上傳或傳送前縮小大尺寸照片。"
    - "製作縮圖、頭像、商品圖和社群配圖。"
    - "按精確寬高或百分比縮放圖片，並保持比例。"
  steps:
    - "上傳圖片並查看原始尺寸。"
    - "輸入目標寬高，或選擇快速縮放比例。"
    - "預覽調整後的結果並下載。"
  privacy: "尺寸調整透過瀏覽器 Canvas 在本機完成，所選圖片不會上傳到 TUXIA 伺服器。"
  introduction: |
    圖片尺寸直接影響檔案大小、載入時間以及圖片在版面中的適配度。現代智慧型手機拍出的照片可能高達 4000 × 3000 像素，遠超網站縮圖或社群媒體貼文的需求。TUXIA 的圖片尺寸調整工具讓你可以指定精確的寬度和高度（以像素為單位），或按原始尺寸的百分比進行縮放。長寬比鎖定開關可確保你在變更單一尺寸時不會意外拉伸或壓扁圖片。快速縮放預設值（25%、50%、75%）提供常用縮減比例的一鍵快捷操作。調整後的圖片可匯出為 PNG、JPG 或 WebP。和所有 TUXIA 工具一樣，尺寸調整在瀏覽器本機使用 Canvas API 執行，原始圖片永遠不會離開你的裝置。
  useCases:
    - title: "縮圖與預覽圖製作"
      description: "為商品圖庫、部落格文章列表、影片封面或圖片搜尋結果建立統一的縮圖尺寸。標準化尺寸（如 300 × 300 或 400 × 300）能確保版面一致並加快頁面載入。"
    - title: "社群媒體頭像與封面"
      description: "每個平台都有建議的圖片尺寸：LinkedIn 頭像（400 × 400）、Facebook 封面照片（820 × 312）、Twitter/X 頁首圖片（1500 × 500）。將來源圖片調整為各平台要求的精確尺寸。"
    - title: "電商商品圖片"
      description: "線上商店通常要求所有商品圖片使用相同的尺寸以保持分類頁面一致性。在上傳到商店平台前，先將每張商品照片調整為所需尺寸。"
  technicalNotes:
    - "將圖片放大超過原始尺寸會使瀏覽器內插缺少的像素，導致模糊或柔和。尺寸調整最適合用來縮小（降採樣），而非放大。"
    - "長寬比鎖定功能確保寬度和高度維持原始比例。解除鎖定後可自由設定尺寸，但可能導致圖片拉伸或壓扁。"
    - "快速縮放預設值（25%、50%、75%）會將兩個尺寸都乘以指定百分比。例如，50% 會將 2000 × 1000 的圖片變為 1000 × 500。"
  comparisons: |
    TUXIA 的尺寸調整工具針對快速、互動式的尺寸變更進行了優化，並提供即時的視覺回饋。對於數十張或數百張圖片的批次尺寸調整，桌面工具如 Photoshop（影像處理器）、XnConvert 或命令列工具如 ImageMagick 會更有效率。對於純手機的工作流程，TUXIA 的調整工具可在手機瀏覽器上使用，無需安裝任何應用程式。
  bestPractices:
    - "大多數情況下應保持長寬比鎖定，只有在刻意要改變圖片比例時才解除鎖定。"
    - "在壓縮圖片之前先調整尺寸。縮小尺寸是減少檔案大小最有效的方法，之後再用壓縮進行微調。"
    - "調整尺寸前先查閱目標平台的建議圖片尺寸，每個社群網路、CMS 和電商平台都有特定的尺寸要求。"

crop:
  bestFor:
    - "裁切截圖、照片、頭像和商品圖。"
    - "使用 1:1、4:3、16:9 等常用比例快速裁切。"
    - "旋轉圖片並在匯出前預覽裁切結果。"
  steps:
    - "上傳圖片並選擇裁切比例。"
    - "在畫布上拖動或調整裁切區域。"
    - "預覽裁切結果並下載圖片。"
  privacy: "圖片裁切在瀏覽器本機完成，TUXIA 不會上傳你的圖片。"
  introduction: |
    裁切是為了移除圖片中不需要的區域，以改善構圖、符合特定的長寬比，或將注意力集中在主體上。TUXIA 的圖片裁切工具提供視覺化的畫布編輯器，讓你在上傳的圖片上拖動裁切區域。你可以選擇預設比例——1:1（正方形，適合 Instagram 和頭像）、4:3（標準照片比例）、16:9（寬螢幕，適合影片縮圖和簡報投影片）、3:4、9:16（直立影片）——或選擇自由模式自訂尺寸。你也可以在裁切前將圖片向左或向右旋轉 90 度。畫布會即時顯示裁切結果的預覽，下載時保留裁切區域的完整解析度。
  useCases:
    - title: "社群媒體內容製作"
      description: "將照片裁切為各平台指定的長寬比：Instagram 貼文用 1:1、YouTube 縮圖用 16:9、Instagram 限時動態和 TikTok 用 9:16、Instagram 直式貼文用 4:5。每個平台顯示圖片的方式不同，正確裁切可確保主體不會被意外裁掉。"
    - title: "商品攝影"
      description: "將電商商品照片標準化，裁切為一致的長寬比（通常是 1:1 或 4:3），讓所有商品在分類網格和搜尋結果中呈現統一的外觀。"
    - title: "構圖改善"
      description: "移除分散注意力的背景元素、運用三分構圖法置中主體，或圍繞焦點建立更緊湊的畫面。好的裁切能將平凡的照片變成有力的構圖。"
  technicalNotes:
    - "裁切會永久移除選取區域外的像素。匯出的圖片會具有裁切矩形的精確尺寸，並按原始圖片解析度縮放。"
    - "裁切前旋轉圖片會改變畫布的方向，旋轉效果會反映在最終裁切輸出中。"
    - "裁切區域可透過拖動選取框來移動、拖動邊緣或角落來調整大小，或點擊畫布空白區域重新繪製。"
  comparisons: |
    TUXIA 的裁切工具完全在瀏覽器中以互動式畫布執行，比伺服器端裁切工具反應更快（無需等待上傳），也比桌面編輯器更簡單，適合快速單次裁切。對於進階編輯——透視校正、內容感知裁切或非破壞性裁切——桌面工具如 Lightroom、Photoshop 或裝置內建的照片應用程式提供更多功能。
  bestPractices:
    - "先選擇長寬比再調整裁切區域，這樣可以確保輸出符合目標尺寸，無需猜測。"
    - "為社群媒體裁切時，在主體周圍預留些微緩衝空間，因為部分平台會對預覽縮圖再進行額外裁切。"
    - "如果你日後可能需要裁切掉的區域，請在裁切前另外儲存原始圖片，裁切是破壞性的，下載後無法復原。"

watermark:
  bestFor:
    - "加入品牌文字、作者名稱、草稿標記或版權說明。"
    - "套用單個浮水印、1 行、2 行、3 行或滿版重複浮水印。"
    - "使用文字浮水印或上傳小尺寸圖片浮水印。"
  steps:
    - "上傳需要加入浮水印的圖片。"
    - "輸入浮水印文字，或選擇圖片浮水印。"
    - "調整位置、排列、字號、透明度、旋轉和顏色後下載。"
  privacy: "浮水印處理在瀏覽器本機完成，所選圖片不會上傳到 TUXIA 伺服器。"
  introduction: |
    浮水印是在圖片上加入可見的覆蓋層，用作品牌識別、版權聲明、草稿標記或防止未經授權使用的威懾手段。TUXIA 的圖片浮水印工具支援兩種浮水印類型：文字浮水印（可自訂字型、大小、顏色、透明度和旋轉的自訂文字）和圖片浮水印（上傳標誌或圖形 PNG，可調整大小、透明度和位置）。你可以從五種排列模式中選擇——角落或中央的單個浮水印，或重複排列（1 行、2 行、3 行或滿版平鋪圖案）。所有調整都會在畫布上即時更新預覽，讓你在匯出前清楚看到浮水印的最終效果。浮水印圖片完全在你的瀏覽器中合成，原始圖片和浮水印圖片都不會上傳到任何伺服器。
  useCases:
    - title: "品牌與版權保護"
      description: "在線上分享照片前，將品牌名稱、標誌或網站網址以半透明浮水印加入圖片。雖然浮水印無法完全防範盜用（可被裁切或編輯去除），但可作為可見的威懾並方便追溯到來源。"
    - title: "草稿與審閱標記"
      description: "在進行中的圖片、設計模型或敏感文件上套用「草稿」、「預覽」、「機密」或「禁止散佈」等文字浮水印，再分享給客戶或審閱者。"
    - title: "作品集與社群媒體品牌"
      description: "攝影師和藝術家可以在作品集圖片的角落加入低調的浮水印，讓觀眾即使圖片被未標註來源地分享，仍能識別創作者。"
  technicalNotes:
    - "滿版和多行浮水印比單個角落浮水印提供更強的保護。角落浮水印可被輕易裁切去除，而平鋪浮水印則難以移除。"
    - "圖片浮水印（標誌）使用透明背景的 PNG 效果最佳，透明度控制會均勻套用到整個浮水印圖片。"
    - "浮水印文字顏色應與底層圖片形成對比。對於背景多變的圖片，可考慮使用半透明白色或黑色文字搭配對比陰影。"
  comparisons: |
    TUXIA 的浮水印工具以本機為優先，意味著你的圖片和浮水印素材永遠不會離開瀏覽器，相較於雲端浮水印工具具有明顯的隱私優勢。不過，對於大量照片的批次浮水印處理，桌面工具如 Lightroom（附浮水印匯出）或命令列工具如 ImageMagick 會更有效率。
  bestPractices:
    - "文字浮水印透明度設為 30-50%，足以被看見又不會過度破壞觀看體驗。"
    - "品牌保護使用滿版平鋪排列，作品集展示則在角落使用小型的單個浮水印。"
    - "使用圖片浮水印（標誌）時，上傳透明背景的 PNG，工具會直接疊加，無需背景移除。"
    - "在預期的顯示尺寸下測試浮水印效果。全解析度下看起來合適的浮水印，在圖片縮小後可能變得難以辨識。"

retouch:
  bestFor:
    - "用馬賽克遮擋隱私區域，例如車牌、QR Code、文字或頭像。"
    - "對小範圍視覺瑕疵做輕量修復。"
    - "匯出不含敏感局部資訊的分享版本。"
  steps:
    - "上傳圖片並選擇局部擦除或馬賽克模式。"
    - "調整筆刷大小和強度，在目標區域塗抹。"
    - "預覽結果並下載處理後的圖片。"
  privacy: "局部擦除和馬賽克都在瀏覽器本機完成，所選圖片不會上傳到 TUXIA 伺服器。"
  introduction: |
    當你需要公開分享圖片時，有時必須遮蔽敏感資訊——人群照片中的臉孔、車輛照片中的車牌、文件上的電話號碼，或收據上的信用卡號碼。TUXIA 的修復與馬賽克工具提供兩種局部圖片編輯模式：輕量修復（用於小型瑕疵或輕微干擾，使用像素混合來平滑塗抹區域）和馬賽克遮蔽（用於隱私保護，套用像素化網格來模糊化細節）。你使用可調整大小的筆刷在目標區域塗抹，選擇模式後套用效果。結果以新圖片下載，編輯內容已內嵌。所有處理都在 Canvas 上本機進行，敏感圖片永遠不會離開你的裝置。
  useCases:
    - title: "分享前的隱私保護"
      description: "在將螢幕截圖、照片或文件掃描上傳到網路或傳送給他人之前，先模糊或像素化處理臉孔、車牌、門牌號碼、電子郵件地址、電話號碼和其他個人資訊。"
    - title: "小型瑕疵清理"
      description: "使用輕量修復模式移除照片中的小型灰塵斑點、皮膚瑕疵、雜亂髮絲或輕微的感光元件汙點。最適合處理小型且孤立的不完美處，而非大面積編輯。"
    - title: "敏感文件遮蔽"
      description: "在文件照片上套用馬賽克遮蔽，隱藏機密文字、帳號號碼、簽名或 QR Code 片段後，再分享作為參考或客服用途。"
  technicalNotes:
    - "修復模式採用像素級混合，會取樣周圍像素並嘗試在塗抹區域建立平滑過渡。效果取決於圖片內容和筆刷大小。"
    - "馬賽克強度控制像素化區塊的大小。強度越高，區塊越大，遮蔽效果越強。"
    - "此工具並非 AI 驅動的內容感知填充，而是使用簡單的 Canvas 像素操作。對於複雜的物件移除或大面積重建，請考慮具備 AI 功能的專用工具。"
    - "支援的最大圖片尺寸為 10 MB，以確保筆刷互動和處理的流暢性。"
  comparisons: |
    TUXIA 的修復工具在瀏覽器中提供基本的局部編輯功能，無需上傳。它在隱私遮蔽和小型瑕疵修復方面表現出色。對於專業修圖——AI 驅動的物件移除、內容感知填充、皮膚美化或複雜合成——Photoshop、GIMP 或線上 AI 編輯器等專用工具提供遠為進階的功能。TUXIA 的優勢在於隱私和簡便：無需帳號、無需上傳，即可為常見的隱私任務提供即時結果。
  bestPractices:
    - "馬賽克遮蔽時，使用能舒適覆蓋目標區域的筆刷大小，以少數幾筆完成。馬賽克效果在點擊套用按鈕後才會生效。"
    - "修復模式下，將筆刷大小保持接近瑕疵大小，過大的筆觸會產生不自然的混合區域。"
    - "下載前務必以完整尺寸預覽結果，若筆刷未完全覆蓋目標，馬賽克遮蔽可能在邊緣露出痕跡。"
    - "僅處理你有權使用的圖片。對包含未經同意之他人的照片進行遮蔽時，請尊重他人隱私。"

palette:
  bestFor:
    - "從商品圖、截圖或設計稿中擷取主色。"
    - "在圖片預覽上懸停讀取即時顏色。"
    - "複製 HEX、RGB、HSL 或 CSS 變數格式。"
  steps:
    - "上傳圖片並產生配色板。"
    - "在預覽圖上移動滑鼠，查看目前位置顏色。"
    - "切換顏色格式，複製單個顏色或整組配色。"
  privacy: "取色和配色擷取都在瀏覽器本機完成，TUXIA 不會上傳你的圖片。"
  introduction: |
    色彩是視覺設計中最具力量的元素之一，從圖片中擷取合適的顏色可以啟發整個品牌配色、網站主題或 UI 元件庫。TUXIA 的圖片取色器提供兩種功能：透過分析主導色調和色彩分佈，從上傳的圖片中擷取一組 6 色的代表性配色板；以及在圖片預覽上提供即時懸停取色功能，讀取游標所在位置的精確像素顏色。顏色以四種格式顯示——HEX（如 #3B82F6）、RGB（rgb(59, 130, 246)）、HSL（hsl(217, 91%, 60%)）和 CSS 自訂屬性（--color: #3B82F6）——每種格式皆可一鍵複製。配色板和取色功能完全在瀏覽器中執行，你的圖片永遠不會被上傳。
  useCases:
    - title: "品牌顏色擷取"
      description: "上傳標誌、主視覺圖片或情緒板照片，擷取定義品牌視覺識別的主導顏色，將 HEX 值直接複製到品牌指南文件或 CSS 變數檔案中。"
    - title: "UI 與網頁設計"
      description: "從主視覺圖片、插圖或產品照片中擷取顏色，建立和諧的 UI 色彩方案。將擷取的配色用於按鈕、重點元素、背景和文字顏色，自然地與主要圖像互相呼應。"
    - title: "藝術與攝影分析"
      description: "透過擷取和比較配色板，研究藝術作品、攝影或設計參考圖的色彩構成，了解專業圖片如何平衡冷暖色調、飽和度和對比度。"
  technicalNotes:
    - "HEX 格式（#RRGGBB）是網頁和 CSS 中最廣泛使用的顏色格式，每對字元分別代表紅、綠、藍的十六進位值。"
    - "RGB 格式以 0-255 的紅、綠、藍色值指定顏色，適合 JavaScript 和 Canvas 操作中的程式化顏色處理。"
    - "HSL 格式（色相、飽和度、亮度）對設計師來說更直覺，色相是色輪上的角度（0-360），飽和度是色彩強度（0-100%），亮度是明暗程度（0-100%）。"
    - "如果圖片的色彩範圍較窄，擷取出的配色板可能包含看起來相似的顏色。若要取得多元的配色，請使用色彩內容豐富的圖片。"
  comparisons: |
    瀏覽器擴充功能和專用取色器應用程式可從螢幕上任意位置取樣顏色，在跨應用程式工作流程中功能更強大。然而，TUXIA 的工具在單一整合工作區中同時提供配色板擷取和即時像素取色，無需安裝任何軟體。對於詳細的色彩分級、ICC 設定檔管理或印刷色彩空間（CMYK），專業工具如 Adobe Color 或 Capture One 更為合適。
  bestPractices:
    - "依照工作流程在 HEX、RGB 和 HSL 格式間切換。網頁開發者通常使用 HEX，UI 設計師偏好 HSL，Canvas/JavaScript 開發者使用 RGB。"
    - "建立完整色彩方案時，使用「全部複製」按鈕一次複製全部六個配色。"
    - "為確保準確的顏色取樣，請確認你的瀏覽器和顯示器已校色，顏色在不同螢幕上看起來可能有所差異。"
    - "在擷取配色板之前，先在感興趣的區域上使用懸停取色器，這讓你可以直接驗證特定像素的顏色。"

exif:
  bestFor:
    - "查看 JPEG 照片中的相機型號和拍攝參數。"
    - "檢查圖片尺寸、時間、光圈、快門、ISO 和基礎中繼資料。"
    - "發布前確認照片是否包含 GPS 位置資訊。"
  steps:
    - "上傳 JPEG 照片或瀏覽器支援的圖片檔案。"
    - "查看圖片預覽和擷取到的中繼資料欄位。"
    - "依照結果判斷是否需要另行移除敏感中繼資料。"
  privacy: "EXIF 讀取在瀏覽器本機完成，TUXIA 不會上傳你的照片。"
  introduction: |
    每張數位照片包含的不只是像素，還攜帶著記錄拍攝方式、時間和地點的中繼資料。EXIF（可交換影像檔案格式）中繼資料由相機和智慧型手機嵌入 JPEG 和 TIFF 檔案中，儲存相機型號、鏡頭、曝光設定（光圈、快門速度、ISO）、拍攝日期和時間、GPS 座標、影像方向，甚至包括用於編輯照片的軟體等詳細資訊。TUXIA 的 EXIF 中繼資料檢視器使用 exif.js 程式庫讀取這些資料，並以清晰易讀的格式與圖片預覽一同呈現。它還會顯示基本檔案資訊，如圖片尺寸和檔案類型。了解照片的中繼資料對於隱私意識、攝影工作流程分析和驗證圖片真實性至關重要。
  useCases:
    - title: "分享前的隱私檢查"
      description: "智慧型手機和許多相機預設會在照片中嵌入 GPS 座標。在網路上分享或傳送照片給他人之前，使用 EXIF 檢視器查看是否包含 GPS 資料。若資料會暴露你的住家、工作地點或目前位置，你可能需要在分享前移除中繼資料。"
    - title: "攝影工作流程分析"
      description: "回顧過去拍攝的曝光設定（光圈、快門速度、ISO），了解哪些設定奏效、哪些沒有。比較多張照片的中繼資料，找出拍攝風格的規律或診斷曝光問題。"
    - title: "圖片真實性驗證"
      description: "檢查拍攝日期、相機型號和編輯軟體欄位，驗證關於照片拍攝時間和方式的說法，有助於識別經編輯或誤導性的圖片。"
  technicalNotes:
    - "EXIF 資料最常見於 JPEG 和 TIFF 檔案。PNG 和 WebP 檔案通常不包含 EXIF 中繼資料，但部分工具可能以非標準方式嵌入。"
    - "許多社群媒體平台和即時通訊應用程式會在上傳或分享圖片時移除 EXIF 中繼資料。螢幕截圖、AI 生成的圖片和經過大量編輯的匯出檔案通常也缺乏 EXIF 資料。"
    - "EXIF 中的 GPS 座標以度、分、秒格式儲存，並可能包含海拔資料。當這些資料存在時，可以相當精確地定位拍攝位置。"
    - "「軟體」EXIF 欄位通常會揭示最後用於編輯照片的程式，例如 Adobe Photoshop、Lightroom 或手機內建的編輯器。"
  comparisons: |
    作業系統的檔案總管（Windows 檔案屬性、macOS 預覽程式檢閱器）無需額外工具即可顯示基本 EXIF 資料。專用 EXIF 檢視器如 ExifTool（命令列）或 PhotoME 提供詳盡的中繼資料涵蓋範圍，包括 TUXIA 檢視器未解析的製造商特定標籤。TUXIA 的檢視器專注於最常需要的欄位，且無需安裝即可在瀏覽器中即時運作。
  bestPractices:
    - "在線上分享個人照片前務必檢查 EXIF 中繼資料，尤其是住家拍攝的照片。如果擔心位置隱私，請移除 GPS 資料。"
    - "如果你的相機時鐘設定不正確，EXIF 中的拍攝時間也會出錯。請用此資訊評估中繼資料的可靠性。"
    - "對於不顯示任何 EXIF 資料的照片，應考慮中繼資料可能已被刻意或自動移除，這在透過即時通訊應用程式分享的圖片中很常見。"
